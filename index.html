<!doctype html><!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Preoperacional Corditráficos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una sola columna de formulario para celular, encabezado fijo con pestañas y barra inferior con estado y envío. */
:root{
  --bg:#EBEFF1; --surface:#FFFFFF; --ink:#14212B; --muted:#586873; --line:#D3DBE0;
  --accent:#1F4FA3; --accent-ink:#FFFFFF;
  --ok:#1E7B4F; --ok-bg:#DDF1E6; --bad:#B8322A; --bad-bg:#F8E0DD; --warn:#8A5200; --warn-bg:#FBEBC8;
  --plate:#F7C600; --plate-ink:#111111;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --surface:#162029; --ink:#E6EDF1; --muted:#93A4AF; --line:#29363F;
    --accent:#6DB1EE; --accent-ink:#0B1620;
    --ok:#5CC28F; --ok-bg:#12301F; --bad:#FF8A80; --bad-bg:#3A1C1A; --warn:#F2B84B; --warn-bg:#35280E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#162029; --ink:#E6EDF1; --muted:#93A4AF; --line:#29363F;
  --accent:#6DB1EE; --accent-ink:#0B1620;
  --ok:#5CC28F; --ok-bg:#12301F; --bad:#FF8A80; --bad-bg:#3A1C1A; --warn:#F2B84B; --warn-bg:#35280E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:34px;width:auto;background:#fff;border-radius:6px;padding:2px 6px;display:block}
.ttl{font:700 1.5rem/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:8px 0 0}
.brand .now{font:500 .8rem var(--f-mono);color:var(--muted);text-align:right}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 .95rem var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:16px 130px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>h2,.card-h{font:700 1.3rem/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.notice{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 14px;font-weight:500}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font:600 .75rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 1rem var(--f-body)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stack-sm{grid-template-columns:1fr}}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.bad{color:var(--bad)} .hint.good{color:var(--ok)} .hint.warn{color:var(--warn)}
.plate{background:var(--plate)!important;color:var(--plate-ink)!important;border:3px solid #111!important;font:600 1.5rem var(--f-mono)!important;text-align:center;letter-spacing:.14em;text-transform:uppercase;max-width:12rem}
.mono{font-family:var(--f-mono)}
.kmin{font:600 1.6rem var(--f-mono)!important;letter-spacing:.04em}

/* control segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;font-size:.95rem;text-align:center;line-height:1.15}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.tri input[value=ok]:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.tri input[value=mal]:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.tri input[value=na]:checked+span{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.seg.dmg input[value=si]:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg.tri input[value=ok]:checked+span,:root:not([data-theme="light"]) .seg.tri input[value=mal]:checked+span,:root:not([data-theme="light"]) .seg.dmg input[value=si]:checked+span{color:#0B1620}}
:root[data-theme="dark"] .seg.tri input[value=ok]:checked+span,:root[data-theme="dark"] .seg.tri input[value=mal]:checked+span,:root[data-theme="dark"] .seg.dmg input[value=si]:checked+span{color:#0B1620}

/* checklist */
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:600 .85rem var(--f-mono);color:var(--muted)}
.allok{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--accent)}
.items{display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:500}
.item .crit{font:600 .65rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-left:6px}

/* fotos */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{min-width:0}
.slotbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;max-width:100%;border:2px dashed var(--line);border-radius:10px;background:var(--bg);cursor:pointer;overflow:hidden;text-align:center;padding:8px;color:var(--muted)}
.slotbox svg{width:30px;height:30px}
.slotbox .t{font-weight:600;font-size:.85rem;line-height:1.15;color:var(--ink)}
.slotbox .o{font-size:.75rem}
.slotbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slotbox .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-weight:600;font-size:.78rem;padding:4px 8px;text-align:left;display:flex;justify-content:space-between;gap:6px}
.slot.has .slotbox{border-style:solid;border-color:var(--ok)}
.missing .slotbox,.missing.field input,.missing.field select,.missing.field textarea,.missing.item .seg span,.missing.item input[type=text]{border-color:var(--bad)}
.missing .slotbox{border-style:solid}
.missing>.hint.req,.missing .hint.req{display:block}
.hint.req{display:none;color:var(--bad);font-weight:600}

.cont{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.cont .cont-h{display:flex;justify-content:space-between;align-items:center}
.cont .cont-h b{font:700 1.15rem var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.link{background:none;border:0;color:var(--bad);font-weight:600;cursor:pointer;padding:6px}
.btn{min-height:48px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:600;cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chip{display:inline-flex;align-self:flex-start;align-items:center;padding:3px 10px;border-radius:99px;font:700 .8rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.chip.apto{background:var(--ok-bg);color:var(--ok)} .chip.obs{background:var(--warn-bg);color:var(--warn)} .chip.no{background:var(--bad-bg);color:var(--bad)}
.bar .msg{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{white-space:nowrap}
.bar .btn.no{background:var(--bad);border-color:var(--bad);color:#fff}

/* registros */
.row{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row summary::-webkit-details-marker{display:none}
.row .pl{font:600 1.1rem var(--f-mono);letter-spacing:.08em}
.row .meta{font-size:.85rem;color:var(--muted);grid-column:1/-1}
.row .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs a{display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.done{align-items:flex-start}
.grow{flex:1}.tight{margin:6px 0 0;padding-left:18px}.mt6{margin-top:6px}.m4{margin:4px 0}.m0{margin:0}
.done h2{font-size:1.8rem}
@media (prefers-reduced-motion:no-preference){.card,.row{transition:border-color .15s}}
</style>
</head>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Preoperacional Corditráficos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una sola columna de formulario para celular, encabezado fijo con pestañas y barra inferior con estado y envío. */
:root{
  --bg:#EBEFF1; --surface:#FFFFFF; --ink:#14212B; --muted:#586873; --line:#D3DBE0;
  --accent:#1F4FA3; --accent-ink:#FFFFFF;
  --ok:#1E7B4F; --ok-bg:#DDF1E6; --bad:#B8322A; --bad-bg:#F8E0DD; --warn:#8A5200; --warn-bg:#FBEBC8;
  --plate:#F7C600; --plate-ink:#111111;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --surface:#162029; --ink:#E6EDF1; --muted:#93A4AF; --line:#29363F;
    --accent:#6DB1EE; --accent-ink:#0B1620;
    --ok:#5CC28F; --ok-bg:#12301F; --bad:#FF8A80; --bad-bg:#3A1C1A; --warn:#F2B84B; --warn-bg:#35280E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --surface:#162029; --ink:#E6EDF1; --muted:#93A4AF; --line:#29363F;
  --accent:#6DB1EE; --accent-ink:#0B1620;
  --ok:#5CC28F; --ok-bg:#12301F; --bad:#FF8A80; --bad-bg:#3A1C1A; --warn:#F2B84B; --warn-bg:#35280E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:34px;width:auto;background:#fff;border-radius:6px;padding:2px 6px;display:block}
.ttl{font:700 1.5rem/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:8px 0 0}
.brand .now{font:500 .8rem var(--f-mono);color:var(--muted);text-align:right}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 .95rem var(--f-body);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:16px 130px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>h2,.card-h{font:700 1.3rem/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.notice{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px 14px;font-weight:500}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font:600 .75rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 1rem var(--f-body)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stack-sm{grid-template-columns:1fr}}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.bad{color:var(--bad)} .hint.good{color:var(--ok)} .hint.warn{color:var(--warn)}
.plate{background:var(--plate)!important;color:var(--plate-ink)!important;border:3px solid #111!important;font:600 1.5rem var(--f-mono)!important;text-align:center;letter-spacing:.14em;text-transform:uppercase;max-width:12rem}
.mono{font-family:var(--f-mono)}
.kmin{font:600 1.6rem var(--f-mono)!important;letter-spacing:.04em}

/* control segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;font-size:.95rem;text-align:center;line-height:1.15}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.tri input[value=ok]:checked+span{background:var(--ok);border-color:var(--ok);color:#fff}
.seg.tri input[value=mal]:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.tri input[value=na]:checked+span{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.seg.dmg input[value=si]:checked+span{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg.tri input[value=ok]:checked+span,:root:not([data-theme="light"]) .seg.tri input[value=mal]:checked+span,:root:not([data-theme="light"]) .seg.dmg input[value=si]:checked+span{color:#0B1620}}
:root[data-theme="dark"] .seg.tri input[value=ok]:checked+span,:root[data-theme="dark"] .seg.tri input[value=mal]:checked+span,:root[data-theme="dark"] .seg.dmg input[value=si]:checked+span{color:#0B1620}

/* checklist */
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:600 .85rem var(--f-mono);color:var(--muted)}
.allok{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--accent)}
.items{display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:500}
.item .crit{font:600 .65rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-left:6px}

/* fotos */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{min-width:0}
.slotbox{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;max-width:100%;border:2px dashed var(--line);border-radius:10px;background:var(--bg);cursor:pointer;overflow:hidden;text-align:center;padding:8px;color:var(--muted)}
.slotbox svg{width:30px;height:30px}
.slotbox .t{font-weight:600;font-size:.85rem;line-height:1.15;color:var(--ink)}
.slotbox .o{font-size:.75rem}
.slotbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slotbox .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-weight:600;font-size:.78rem;padding:4px 8px;text-align:left;display:flex;justify-content:space-between;gap:6px}
.slot.has .slotbox{border-style:solid;border-color:var(--ok)}
.missing .slotbox,.missing.field input,.missing.field select,.missing.field textarea,.missing.item .seg span,.missing.item input[type=text]{border-color:var(--bad)}
.missing .slotbox{border-style:solid}
.missing>.hint.req,.missing .hint.req{display:block}
.hint.req{display:none;color:var(--bad);font-weight:600}

.cont{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.cont .cont-h{display:flex;justify-content:space-between;align-items:center}
.cont .cont-h b{font:700 1.15rem var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.link{background:none;border:0;color:var(--bad);font-weight:600;cursor:pointer;padding:6px}
.btn{min-height:48px;padding:10px 16px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:600;cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chip{display:inline-flex;align-self:flex-start;align-items:center;padding:3px 10px;border-radius:99px;font:700 .8rem var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.chip.apto{background:var(--ok-bg);color:var(--ok)} .chip.obs{background:var(--warn-bg);color:var(--warn)} .chip.no{background:var(--bad-bg);color:var(--bad)}
.bar .msg{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{white-space:nowrap}
.bar .btn.no{background:var(--bad);border-color:var(--bad);color:#fff}

/* registros */
.row{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.row summary::-webkit-details-marker{display:none}
.row .pl{font:600 1.1rem var(--f-mono);letter-spacing:.08em}
.row .meta{font-size:.85rem;color:var(--muted);grid-column:1/-1}
.row .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs a{display:block;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.done{align-items:flex-start}
.grow{flex:1}.tight{margin:6px 0 0;padding-left:18px}.mt6{margin-top:6px}.m4{margin:4px 0}.m0{margin:0}
.done h2{font-size:1.8rem}
@media (prefers-reduced-motion:no-preference){.card,.row{transition:border-color .15s}}
</style>
</head>
